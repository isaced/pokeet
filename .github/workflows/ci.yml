name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # All three jobs need macOS: PokeetCore links ImageIO/CoreGraphics, so Linux
  # runners are out. "latest" tracks the newest image (macOS 26 / Xcode 26 at the
  # time of writing) instead of pinning an older macOS 15 image that queues
  # longer and ships Xcode 16. Pin an explicit label here if a release needs a
  # specific Xcode.
  kernel:
    name: Agent kernel
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # PokeetCore has no remote dependencies, so its build directory is safe to
      # reuse: unchanged files are simply not recompiled.
      - name: Cache the build directory
        uses: actions/cache@v4
        with:
          path: Packages/PokeetCore/.build
          key: ${{ runner.os }}-core-${{ hashFiles('Packages/PokeetCore/Package.swift', 'Packages/PokeetCore/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-core-
      - name: swift test (PokeetCore)
        run: swift test --package-path Packages/PokeetCore

  scripting:
    name: Scripting runtime
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache the build directory
        uses: actions/cache@v4
        with:
          path: Packages/PokeetScripting/.build
          key: ${{ runner.os }}-scripting-${{ hashFiles('Packages/PokeetScripting/Package.swift', 'Packages/PokeetScripting/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-scripting-
      - name: swift test (PokeetScripting)
        run: swift test --package-path Packages/PokeetScripting

  app:
    name: App build & tests
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The Xcode project is generated and gitignored, so CI regenerates it.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Pokeet.xcodeproj
        run: xcodegen generate

      # A clean build compiles ~390 Swift files and 215 C files, almost all of it
      # third-party (Textual, SwiftGit2, libgit2, HighlightSwift) that never
      # changes between commits. Caching DerivedData turns that into an
      # incremental build of the files that actually changed.
      - name: Record the toolchain version
        id: toolchain
        run: echo "version=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache packages and build products
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/Pokeet-*
          key: ${{ runner.os }}-${{ steps.toolchain.outputs.version }}-deps-${{ hashFiles('project.yml', 'Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.toolchain.outputs.version }}-deps-

      # Simulator names follow Xcode releases; pick whatever iPhone this image
      # has instead of hardcoding "iPhone 16".
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$udid" ]; then
            echo "No iPhone simulator available on this runner." >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Using simulator $udid"

      - name: xcodebuild test
        run: |
          xcodebuild test \
            -project Pokeet.xcodeproj \
            -scheme Pokeet \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/Pokeet.xcresult" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Upload the result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pokeet-xcresult
          path: ${{ runner.temp }}/Pokeet.xcresult
          retention-days: 7
