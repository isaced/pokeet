name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Both jobs need macOS: PokeetCore links ImageIO/CoreGraphics, so Linux runners
  # are out. "latest" tracks the newest image (macOS 26 / Xcode 26 at the time of
  # writing) rather than pinning a macOS 15 image that ships Xcode 16. Pin an
  # explicit label if a release ever needs a specific Xcode.
  #
  # Two jobs, not three: GitHub-hosted macOS arm64 capacity is scarce and every
  # job wants its own slot. Three parallel jobs meant one of them sat in the
  # queue for 15 minutes and then failed with "not acquired by Runner".
  tests:
    name: Kernel & scripting
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Neither package has remote dependencies, so their build directories are
      # safe to reuse: unchanged files are simply not recompiled.
      - name: Cache build directories
        uses: actions/cache@v6
        with:
          path: |
            Packages/PokeetCore/.build
            Packages/PokeetScripting/.build
          key: ${{ runner.os }}-swift-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: swift test (PokeetCore)
        run: swift test --package-path Packages/PokeetCore

      - name: swift test (PokeetScripting)
        run: swift test --package-path Packages/PokeetScripting

  app:
    name: App build & tests
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # The Xcode project is generated and gitignored, so CI regenerates it.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Pokeet.xcodeproj
        run: xcodegen generate

      # A clean build compiles ~390 Swift files and 215 C files, almost all of it
      # third-party (Textual, SwiftGit2, libgit2, HighlightSwift) that never
      # changes between commits. Caching DerivedData turns that into an
      # incremental build of the files that actually changed.
      - name: Record the toolchain version
        id: toolchain
        run: echo "version=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache packages and build products
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/Pokeet-*
          key: ${{ runner.os }}-${{ steps.toolchain.outputs.version }}-deps-${{ hashFiles('project.yml', 'Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.toolchain.outputs.version }}-deps-

      # Simulator names follow Xcode releases, so pick whatever iPhone this image
      # has instead of hardcoding "iPhone 16". Booting it here, before the build,
      # hides most of the ~3 minutes CoreSimulator otherwise spends after
      # compilation: simctl boot returns immediately and the boot runs while the
      # package graph resolves and the app compiles.
      - name: Pick an iPhone simulator and start booting it
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$udid" ]; then
            echo "No iPhone simulator available on this runner." >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Booting $udid while the build runs"
          xcrun simctl boot "$udid" 2>/dev/null || true

      - name: xcodebuild test
        run: |
          xcodebuild test \
            -project Pokeet.xcodeproj \
            -scheme Pokeet \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/Pokeet.xcresult" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_DEBUG_DYLIB=NO

      - name: Upload the result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Pokeet-xcresult
          path: ${{ runner.temp }}/Pokeet.xcresult
          retention-days: 7
