name: CI

on:
  push:
    branches: [main]
    # Docs and licence changes cannot break the build; skipping them keeps
    # scarce macOS runners free.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One macOS job, not three. GitHub-hosted macOS arm64 capacity is scarce and
  # every job needs its own runner slot, so extra jobs mostly bought queue time:
  # a job that never gets acquired is cancelled after ~15 minutes. Two earlier
  # runs lost a job exactly that way while the other one ran.
  #
  # Everything needs macOS: PokeetCore links ImageIO/CoreGraphics, so Linux
  # runners are out. The arm64 images are capacity-starved ("jobs targeting
  # macOS arm64 runners may experience longer queue times", then cancelled after
  # 15 minutes), and the Intel image has more cores and RAM anyway: 4 / 14 GB
  # against 3 / 7 GB. Switch back to macos-latest when arm64 stops queueing.
  test:
    name: Build & test
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Booting a simulator takes a minute or two on these runners, so start it
      # first and let it come up while the Swift tests build. simctl boot returns
      # immediately; the boot carries on in the background.
      - name: Pick an iPhone simulator and start booting it
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$udid" ]; then
            echo "No iPhone simulator available on this runner." >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Booting $udid while the build runs"
          xcrun simctl boot "$udid" 2>/dev/null || true

      # Neither package has remote dependencies, so their build directories are
      # safe to reuse. Measured: 710s → 477s for the kernel with a 105s restore,
      # so keep it, but expect a partial win — SwiftPM still rebuilds part of
      # the graph on a fresh runner.
      - name: Cache Swift package builds
        uses: actions/cache@v6
        with:
          path: |
            Packages/PokeetCore/.build
            Packages/PokeetScripting/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-

      - name: swift test (PokeetCore)
        run: swift test --package-path Packages/PokeetCore

      - name: swift test (PokeetScripting)
        run: swift test --package-path Packages/PokeetScripting

      # The Xcode project is generated and gitignored, so CI regenerates it.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Pokeet.xcodeproj
        run: xcodegen generate

      # Only the package checkouts are cached here. Restoring build products was
      # measured and dropped: Xcode rebuilt everything anyway because the restored
      # objects are older than the checkout, and touching them would hide a
      # changed source file that the key does not know about.
      - name: Record the toolchain version
        id: toolchain
        run: echo "version=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache packages and build products
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/Pokeet-*/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-deps-${{ hashFiles('project.yml', 'Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-deps-

      - name: xcodebuild test
        run: |
          xcodebuild test \
            -project Pokeet.xcodeproj \
            -scheme Pokeet \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/Pokeet.xcresult" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_DEBUG_DYLIB=NO

      - name: Upload the result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Pokeet-xcresult
          path: ${{ runner.temp }}/Pokeet.xcresult
          retention-days: 7
