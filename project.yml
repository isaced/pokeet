name: Pokeet

options:
  bundleIdPrefix: com.isaced
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  PokeetCore:
    path: Packages/PokeetCore
  PokeetScripting:
    path: Packages/PokeetScripting
  PokeetPython:
    path: Packages/PokeetPython
  SwiftGitX:
    url: https://github.com/ibrahimcetin/SwiftGitX.git
    exactVersion: 0.4.0
  libgit2:
    url: https://github.com/ibrahimcetin/libgit2.git
    exactVersion: 1.9.2
  Textual:
    url: https://github.com/gonzalezreal/textual.git
    exactVersion: 0.5.0
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift.git
    exactVersion: 1.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"

# Xcode Cloud picks its workflow scheme from the repository, so the scheme has to be a
# shared file; Xcode's auto-created schemes live in xcuserdata and are invisible to CI.
schemes:
  Pokeet:
    build:
      targets:
        Pokeet: all
        PokeetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PokeetTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Pokeet:
    type: application
    platform: iOS
    sources:
      - path: Pokeet
        excludes:
          - Info.plist
      # Staged by scripts/fetch-python.sh; a folder reference so the tree keeps its shape,
      # which the interpreter needs to find encodings/ and the extension modules.
      - path: Vendor/python-home
        type: folder
        buildPhase: resources
    dependencies:
      - package: PokeetCore
      - package: PokeetScripting
      - package: PokeetPython
      # Staged by scripts/fetch-python.sh. Embedded, because CPython is a dylib.
      - framework: Vendor/Python.xcframework
        embed: true
      - package: SwiftGitX
      - package: libgit2
      - package: Textual
      - package: HighlightSwift
    info:
      path: Pokeet/Info.plist
      properties:
        CFBundleDisplayName: Pokeet
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaced.pokeet
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"

  PokeetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PokeetTests
    dependencies:
      - target: Pokeet
      - package: PokeetCore
      - package: PokeetScripting
      - package: SwiftGitX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaced.pokeet.tests
        GENERATE_INFOPLIST_FILE: YES
