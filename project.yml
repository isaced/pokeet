name: Pokeet

options:
  bundleIdPrefix: com.isaced
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PokeetCore:
    path: Packages/PokeetCore
  SwiftGitX:
    url: https://github.com/ibrahimcetin/SwiftGitX.git
    exactVersion: 0.4.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Pokeet:
    type: application
    platform: iOS
    sources:
      - path: Pokeet
        excludes:
          - Info.plist
    dependencies:
      - package: PokeetCore
      - package: SwiftGitX
    info:
      path: Pokeet/Info.plist
      properties:
        CFBundleDisplayName: Pokeet
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaced.pokeet
        GENERATE_INFOPLIST_FILE: NO

  PokeetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PokeetTests
    dependencies:
      - target: Pokeet
      - package: PokeetCore
      - package: SwiftGitX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaced.pokeet.tests
        GENERATE_INFOPLIST_FILE: YES
